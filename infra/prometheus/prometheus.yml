global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'lexi-production'
    environment: 'docker'

scrape_configs:
  # ==================== LEXI API ====================
  - job_name: 'lexi-api'
    static_configs:
      # ← USA NOME DO CONTAINER (não localhost)
      - targets: ['translator:8000']
        labels:
          service: 'translator-api'
    
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
  
  # ==================== PROMETHEUS SELF ====================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']